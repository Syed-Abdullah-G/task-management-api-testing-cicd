spring.application.name=task-management-api

# In-memory H2 database (no external database required). Embedded H2 uses the default "sa" user.
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Never expose internals to API clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=INFO
logging.level.com.example.taskmanager=INFO

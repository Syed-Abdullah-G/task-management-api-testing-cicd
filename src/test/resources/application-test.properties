# Used by the integration tests (@ActiveProfiles("test")).
# A dedicated in-memory H2 database keeps tests independent of any external database.
spring.datasource.url=jdbc:h2:mem:taskdb-it;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.com.example.taskmanager=WARN
